name: Publish verified APK archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the verified archive
        uses: actions/checkout@v4
        with:
          ref: zenin-icon-crack-v1
          lfs: true
          persist-credentials: false
      - name: Verify archive checksum
        run: |
          printf '%s  %s\n' '2f4a1bb850e5189a5d1466d7fae00db5a33a6ce9d43be33cca088f71db882bdb' 'artifacts/Zenin_Icon_Crack.zip' | sha256sum -c -
      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload zenin-icon-crack-v1 artifacts/Zenin_Icon_Crack.zip
